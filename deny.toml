[graph]
exclude-dev = true

[advisories]
yanked = "deny"
ignore = [
  # Build-time proc macro pulled in by gtk-rs 0.18 (Linux windowing in Tauri/wry/tao).
  # Remove once Tauri moves off gtk3-rs.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is only a build-time macro dependency of gtk-rs 0.18 via Tauri" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
