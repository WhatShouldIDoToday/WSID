name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel: a cancelled publish can leave a half-made release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release Please's `simple` type does not touch Cargo.lock, so refresh it on the Release PR branch.
  # The push uses the App token so CI runs on the new commit.
  lock-sync:
    name: lock-sync
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
          cache: true
      - name: Refresh Cargo.lock
        run: cargo update --workspace
      - name: Commit Cargo.lock if it changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock"
          git push

  build-cli:
    name: build-cli
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-cli.yml
    secrets: inherit
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      tag: ${{ needs.release-please.outputs.tag_name }}
      environment: release
      publish: true

  build-gui:
    name: build-gui
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-gui.yml
    secrets: inherit
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      tag: ${{ needs.release-please.outputs.tag_name }}
      environment: release
      publish: true

  # Checksums are added last, then the draft becomes the public, latest release.
  publish:
    name: publish
    needs: [release-please, build-cli, build-gui]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Add checksums and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir dist
          gh release download "$TAG" --dir dist --skip-existing
          rm -f dist/SHA256SUMS
          if [ -z "$(ls -A dist)" ]; then
            echo "No assets found on release $TAG."
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release upload "$TAG" dist/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest

  sync-dev:
    name: sync-dev
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open a PR from main into dev
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open="$(gh pr list --base dev --head main --state open --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "A main into dev PR is already open."
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "chore: sync main into dev" \
            --body "Brings the release commit from main back into dev. Merge with a merge commit, not a squash."
