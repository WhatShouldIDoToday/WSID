name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: mise run fmt:check
      - run: mise run lint
      # cargo-about runs offline, so download every crate (all targets) first.
      - run: cargo fetch --locked
      - run: mise run licenses:check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: mise run test:ci
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: junit (${{ matrix.os }})
          require_tests: false

  deny:
    name: deny (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        checks: [bans licenses sources, advisories]
    # Advisory database changes must not block unrelated merges.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  typos:
    name: typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.0

  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, test, deny, typos]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
