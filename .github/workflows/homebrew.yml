name: Homebrew

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v.
        required: true
        type: string
      tag:
        description: Published release tag.
        required: true
        type: string
      channel:
        description: stable or beta.
        required: true
        type: string

permissions:
  contents: read

jobs:
  tap:
    name: tap (${{ inputs.channel }})
    runs-on: ubuntu-24.04
    # Serialize pushes to the tap so two releases cannot race.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
      - name: Render formula and cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: scripts/ci/render-homebrew.sh "$VERSION" "$TAG" "$CHANNEL" tap
      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "The tap is already up to date."
            exit 0
          fi
          git config user.name "wsid-release-bot[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git commit -m "wsid ${CHANNEL} ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
