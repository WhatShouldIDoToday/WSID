name: Build GUI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to build.
        type: string
        required: true
      tag:
        description: Release tag to upload to. Required when publish is true.
        type: string
        default: ""
      environment:
        description: Environment holding signing secrets. Used only when publish is true.
        type: string
        default: ""
      publish:
        description: Sign, notarize, and upload to the draft release. Otherwise build unsigned and upload workflow artifacts.
        type: boolean
        default: false
      prerelease:
        description: Whether the release being uploaded to is a prerelease.
        type: boolean
        default: false
      beta:
        description: Apply the beta version and build the beta app identity with WSID_CHANNEL=beta.
        type: boolean
        default: false

# No workflow-level permissions: a callee can only narrow the caller's token, and uploads need contents: write.
# Callers set the permissions.
jobs:
  build:
    name: gui (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.publish && inputs.environment || '' }}
    env:
      WSID_CHANNEL: ${{ inputs.beta && 'beta' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            install: bun rust aqua:tauri-apps/tauri/cargo-tauri
            args: --bundles app,dmg --target universal-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            install: bun rust aqua:tauri-apps/tauri/cargo-tauri
            args: --bundles deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            # The aqua package has no linux/arm64 binary, so build the Tauri CLI from source.
            install: bun rust
            tauri_from_source: true
            args: --bundles deb,rpm,appimage
          - name: windows-x64
            os: windows-2025
            install: bun rust aqua:tauri-apps/tauri/cargo-tauri
            args: --bundles nsis
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm xdg-utils

      - uses: jdx/mise-action@v5
        with:
          install_args: ${{ matrix.install }}
          cache: true

      - name: Add Rust targets
        if: matrix.targets
        shell: bash
        run: rustup target add ${{ matrix.targets }}

      - name: Build the Tauri CLI from source
        if: matrix.tauri_from_source
        shell: bash
        run: |
          version="$(sed -n 's/^"aqua:tauri-apps\/tauri\/cargo-tauri" = "\(.*\)"$/\1/p' mise.toml)"
          test -n "$version"
          cargo install tauri-cli --version "$version" --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.name }}-${{ inputs.beta && 'beta' || 'stable' }}

      - name: Apply beta version
        if: inputs.beta
        shell: bash
        run: scripts/ci/beta-version.sh

      # RPM versions cannot contain `-`, so Linux packages use semver build metadata (0.1.1+beta.7).
      # Only the bundle version changes. Cargo keeps the prerelease version.
      - name: Use an RPM-safe bundle version
        if: inputs.beta && runner.os == 'Linux'
        run: |
          sed -i 's/^\(  "version": "[^"]*\)-beta\./\1+beta./' crates/wsid-gui/tauri.conf.json

      # Run bun directly: `mise run` would try to install every tool in mise.toml, including ones
      # with no binary for this runner.
      - name: Build frontend
        working-directory: crates/wsid-gui/ui
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Write App Store Connect API key
        if: inputs.publish && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build and upload to draft release
        if: inputs.publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        with:
          projectPath: crates/wsid-gui
          tauriScript: cargo tauri
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.tag }}
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}${{ inputs.beta && ' --config tauri.beta.conf.json' || '' }}

      - name: Build unsigned bundles
        if: ${{ !inputs.publish }}
        shell: bash
        working-directory: crates/wsid-gui
        run: cargo tauri build ${{ matrix.args }}${{ inputs.beta && ' --config tauri.beta.conf.json' || '' }}

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.publish }}
        with:
          name: gui-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 3
